# Tauri desktop (.deb) and Android (APK) — run on demand (~20+ min), not on every prod push.
#
# Actions → Build Tauri apps → Run workflow (pick branch, desktop and/or Android).
# Artifacts: tauri-app, tauri-android-apk
#
# See deploy/WEB_AND_TAURI.md

name: Build Tauri apps

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build (default: main)"
        required: false
        default: main
        type: string
      build_desktop:
        description: "Build Linux .deb (desktop)"
        required: false
        default: true
        type: boolean
      build_android:
        description: "Build Android APK (needs gen/android in repo)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-tauri-desktop:
    name: Tauri desktop (.deb)
    runs-on: ubuntu-latest
    if: inputs.build_desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: front/web/package-lock.json

      - name: Install frontend npm deps
        working-directory: front/web
        run: npm ci

      - name: Install Rust and wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Install system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set build env
        id: env
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build Tauri desktop (.deb)
        working-directory: front/tauri
        env:
          GIT_COMMIT: ${{ steps.env.outputs.short_sha }}
          BUILD_DATE: ${{ steps.env.outputs.date }}
          STG_API_URL: https://smacktalkgaming.com
        run: cargo tauri build --bundles deb

      - name: Upload Tauri desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-app
          path: _build/target/release/bundle/

  build-tauri-android:
    name: Tauri Android (APK)
    runs-on: ubuntu-latest
    if: inputs.build_android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Detect Android scaffold
        id: android_scaffold
        run: |
          if [ -f front/tauri/src-tauri/gen/android/gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No gen/android/gradlew — run cargo tauri android init and commit the scaffold"
          fi

      - name: Set up Node
        if: steps.android_scaffold.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: front/web/package-lock.json

      - name: Install frontend npm deps
        if: steps.android_scaffold.outputs.present == 'true'
        working-directory: front/web
        run: npm ci

      - name: Set up Java 17
        if: steps.android_scaffold.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.android_scaffold.outputs.present == 'true'
        uses: android-actions/setup-android@v3

      - name: Install NDK
        if: steps.android_scaffold.outputs.present == 'true'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install Rust and Android targets
        if: steps.android_scaffold.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            wasm32-unknown-unknown,
            aarch64-linux-android,
            armv7-linux-androideabi,
            i686-linux-android,
            x86_64-linux-android

      - name: Install Trunk
        if: steps.android_scaffold.outputs.present == 'true'
        run: cargo install trunk --locked

      - name: Install Tauri CLI
        if: steps.android_scaffold.outputs.present == 'true'
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Set build env
        if: steps.android_scaffold.outputs.present == 'true'
        id: env
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build Android APK
        if: steps.android_scaffold.outputs.present == 'true'
        working-directory: front/tauri
        env:
          GIT_COMMIT: ${{ steps.env.outputs.short_sha }}
          BUILD_DATE: ${{ steps.env.outputs.date }}
          STG_API_URL: https://smacktalkgaming.com
        run: cargo tauri android build

      - name: Upload Android APK
        if: steps.android_scaffold.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android-apk
          path: front/tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
