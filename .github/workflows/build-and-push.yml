# Production CI/CD: backend + web frontend images (fast path on every push to main).
# Tauri desktop/Android builds are in .github/workflows/build-tauri.yml (manual only).
#
# - Backend: ghcr.io/OWNER/REPO/backend:<tag> → deploy/deploy_stg.sh
# - Frontend: ghcr.io/OWNER/REPO/frontend:<tag>
# See docs/GHCR_SETUP.md and deploy/WEB_AND_TAURI.md.

name: Production CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_frontend_to_pages:
        description: "Deploy web frontend to GitHub Pages"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: backend

jobs:
  build-backend:
    name: Build and push backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build date and version
        id: build-date
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_VERSION=$(date -u +%Y%m%d-%H%M%S)-${SHORT_SHA}
          echo "build_version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.build-date.outputs.date }}
            org.opencontainers.image.version=${{ steps.build-date.outputs.build_version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: back/api/Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ steps.build-date.outputs.short_sha }}
            BUILD_DATE=${{ steps.build-date.outputs.date }}
            RUST_ENV=production
            RUST_LOG=info
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build web frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust and wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Set build env
        id: env
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          BUILD_VERSION=$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)
          echo "build_version=$BUILD_VERSION" >> $GITHUB_OUTPUT

      - name: Build frontend
        working-directory: front/web
        env:
          GIT_COMMIT: ${{ steps.env.outputs.short_sha }}
          BUILD_DATE: ${{ steps.env.outputs.date }}
          BUILD_VERSION: ${{ steps.env.outputs.build_version }}
        run: trunk build --release

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: _build/frontend-dist

  build-frontend-image:
    name: Build and push frontend image
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build env
        id: env
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "build_version=$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/frontend
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.env.outputs.date }}
            org.opencontainers.image.version=${{ steps.env.outputs.build_version }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: front/web/Dockerfile.frontend.caddy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ steps.env.outputs.short_sha }}
            BUILD_DATE=${{ steps.env.outputs.date }}
            BUILD_VERSION=${{ steps.env.outputs.build_version }}
            SOURCE_HASH=${{ steps.env.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-frontend-pages:
    name: Deploy frontend to GitHub Pages
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_frontend_to_pages == 'true'
    needs: build-frontend
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
